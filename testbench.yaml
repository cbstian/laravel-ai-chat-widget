laravel: '@testbench'

providers:
  - Cbstian\AiChat\AiChatServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/'
  install: true
  health: false
  discovers:
    web: true
    api: true
    commands: true
    components: false
    factories: true
    views: false
  build:
    # Copia workbench/.env al skeleton que Testbench arranca. Sin esto, un .env
    # ya creado en vendor/ se queda con el driver viejo (browser).
    - sync-skeleton
    - asset-publish
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
  assets:
    - laravel-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
